<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta - Punto de Venta</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body { display: grid; place-items: center; min-height: 100vh; background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 55%, var(--primary) 140%); padding: 16px; }
        .login { width: 100%; max-width: 420px; padding: 34px 30px; }
        .login .brand { padding: 0 0 24px; justify-content: center; }
        .login .brand-name { color: var(--navy); font-size: 22px; }
        .login .brand-sub { color: var(--gray); }
        .msg { padding: 10px 12px; border-radius: 10px; margin-bottom: 14px; display: none; }
        .msg.error { background: var(--red-soft); color: var(--red); }
        .msg.ok { background: var(--green-soft); color: var(--green); }
    </style>
</head>
<body>
    <form class="card login" id="registerForm">
        <div class="brand">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9h18v2a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/><path d="M5 13v7h14v-7"/><path d="M10 20v-5h4v5"/></svg>
            </div>
            <div>
                <div class="brand-name" id="appName">Mi Tienda</div>
                <div class="brand-sub">Crear cuenta</div>
            </div>
        </div>
        <div class="msg" id="msg"></div>
        <div class="field" id="campoServidor" style="display:none">
            <label for="servidor">Servidor (IP de la PC)</label>
            <div class="row" style="gap:8px">
                <input class="input" id="servidor" placeholder="192.168.1.50:5001" inputmode="url" autocapitalize="off">
                <button type="button" class="btn" id="probarServidor" style="flex:0 0 auto">Probar</button>
            </div>
            <small class="muted" id="estadoServidor"></small>
        </div>
        <div class="field">
            <label for="nombre">Nombre completo</label>
            <input class="input" id="nombre" required autofocus>
        </div>
        <div class="field">
            <label for="usuario">Usuario (para iniciar sesión)</label>
            <input class="input" id="usuario" autocomplete="username" required>
        </div>
        <div class="field">
            <label for="password">Contraseña</label>
            <input class="input" id="password" type="password" minlength="4" autocomplete="new-password" required>
        </div>
        <div class="field">
            <label for="password2">Confirmar contraseña</label>
            <input class="input" id="password2" type="password" minlength="4" autocomplete="new-password" required>
        </div>
        <button class="btn btn-primary btn-lg" id="btnRegistrar" type="submit">Crear cuenta</button>
        <p class="text-center muted" style="margin-top:16px">¿Ya tienes cuenta? <a href="login.html" style="color:var(--primary);font-weight:600">Inicia sesión</a></p>
    </form>

    <script src="config.js"></script>
    <script src="js/api.js"></script>
    <script>
        document.getElementById('appName').textContent = localStorage.getItem('pos-nombre-tienda') || CONFIG.APP_NAME;
        Api.prepararCampoServidor();

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnRegistrar');
            const msg = document.getElementById('msg');
            const mostrar = (texto, tipo) => { msg.textContent = texto; msg.className = `msg ${tipo}`; msg.style.display = 'block'; };
            const password = document.getElementById('password').value;
            if (password !== document.getElementById('password2').value) return mostrar('Las contraseñas no coinciden', 'error');

            btn.disabled = true;
            try {
                const data = await Api.post('/auth/register', {
                    nombre: document.getElementById('nombre').value,
                    usuario: document.getElementById('usuario').value,
                    password
                });
                Api.guardarSesion(data.token, data.user);
                location.href = 'index.html';
            } catch (error) {
                mostrar(error.message, 'error');
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
