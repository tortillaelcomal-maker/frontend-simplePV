<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Punto de Venta</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body { display: grid; place-items: center; min-height: 100vh; background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 55%, var(--primary) 140%); padding: 16px; }
        .login { width: 100%; max-width: 400px; padding: 34px 30px; }
        .login .brand { padding: 0 0 24px; justify-content: center; }
        .login .brand-name { color: var(--navy); font-size: 22px; }
        .login .brand-sub { color: var(--gray); }
        .error { background: var(--red-soft); color: var(--red); padding: 10px 12px; border-radius: 10px; margin-bottom: 14px; display: none; }
    </style>
</head>
<body>
    <form class="card login" id="loginForm">
        <div class="brand">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9h18v2a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/><path d="M5 13v7h14v-7"/><path d="M10 20v-5h4v5"/></svg>
            </div>
            <div>
                <div class="brand-name" id="appName">Mi Tienda</div>
                <div class="brand-sub">Punto de Venta</div>
            </div>
        </div>
        <div class="error" id="error"></div>
        <div class="field" id="campoServidor" style="display:none">
            <label for="servidor">Servidor (IP de la PC)</label>
            <div class="row" style="gap:8px">
                <input class="input" id="servidor" placeholder="192.168.1.50:5001" inputmode="url" autocapitalize="off">
                <button type="button" class="btn" id="probarServidor" style="flex:0 0 auto">Probar</button>
            </div>
            <small class="muted" id="estadoServidor"></small>
        </div>
        <div class="field">
            <label for="usuario">Usuario</label>
            <input class="input" id="usuario" autocomplete="username" required autofocus>
        </div>
        <div class="field">
            <label for="password">Contraseña</label>
            <input class="input" id="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary btn-lg" id="btnLogin" type="submit">Iniciar sesión</button>
        <p class="text-center muted" style="margin-top:16px">¿No tienes cuenta? <a href="register.html" style="color:var(--primary);font-weight:600">Regístrate</a></p>
    </form>

    <script src="config.js"></script>
    <script src="js/api.js"></script>
    <script>
        if (Api.token()) location.href = 'index.html';
        document.getElementById('appName').textContent = localStorage.getItem('pos-nombre-tienda') || CONFIG.APP_NAME;
        Api.prepararCampoServidor();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            const err = document.getElementById('error');
            btn.disabled = true;
            err.style.display = 'none';
            try {
                const data = await Api.post('/auth/login', {
                    usuario: document.getElementById('usuario').value,
                    password: document.getElementById('password').value
                });
                Api.guardarSesion(data.token, data.user);
                location.href = 'index.html';
            } catch (error) {
                err.textContent = error.message;
                err.style.display = 'block';
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
